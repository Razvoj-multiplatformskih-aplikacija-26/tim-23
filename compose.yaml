# Ceo backend jednom komandom:  docker compose up -d
# (pre toga:  copy .env.example .env)
name: kap

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-kap}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Šema baze iz fajlova u apps/server/migrations (dbmate), pa izlazi.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kap}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-kap}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
    volumes:
      - ./apps/server/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # Server u Dartu na Relic-u; pri prvom pokretanju upisuje početne podatke.
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kap}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-kap}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env first}
      SEED_UTC_OFFSET_HOURS: ${SEED_UTC_OFFSET_HOURS:-1}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Pregled baze u pregledaču (nije obavezan):  docker compose --profile tools up -d adminer
  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-kap}
    volumes:
      - ./apps/server/tool/adminer_login.php:/var/www/html/plugins-enabled/login.php:ro
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    depends_on:
      - db

volumes:
  db-data:
