name: kap_workspace
description: Kap, sistem za zakazivanje dobrovoljnog davanja krvi. Workspace razrešava sve aplikacije i pakete zajedno.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/mobile
  - apps/backoffice
  - apps/server
  - packages/domain
  - packages/demo_data
  - packages/blocs
  - packages/ui
  - packages/api_contract
  - packages/api_mapping
  - packages/api_client

dev_dependencies:
  flutter_lints: 6.0.0
