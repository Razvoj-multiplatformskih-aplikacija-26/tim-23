name: backoffice
description: Kap backoffice za medicinsko osoblje i koordinatora; desktop i veb.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  api_client:
    path: ../../packages/api_client
  blocs:
    path: ../../packages/blocs
  demo_data:
    path: ../../packages/demo_data
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.2
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
